<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allowance Tracker (GH₵)</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#e3e1d8;--ac:#0f7b4f;--bad:#c0392b;--track:#ece9df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#202220;--tx:#efeee8;--mut:#a3a298;--bd:#34362f;--ac:#3fcf8e;--bad:#ff7a6b;--track:#2d2f2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--card:#202220;--tx:#efeee8;--mut:#a3a298;--bd:#34362f;--ac:#3fcf8e;--bad:#ff7a6b;--track:#2d2f2a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--tx);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.big{font-size:22px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--ac)}
.bad{color:var(--bad)}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.leg{flex:1;min-width:160px}
.leg div{display:flex;align-items:center;gap:8px;padding:3px 0}
.leg b{width:10px;height:10px;border-radius:3px;flex:none}
.leg span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.days{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.days i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.days small{font-size:10px;color:var(--mut);margin-top:3px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}
h2{font-size:15px;margin:0 0 8px}
</style>
</head>
<body>
<main>
<h1>💸 Allowance Tracker</h1>

<div class="card">
  <div class="g">
    <div><label>Weekly allowance (GH₵)</label><input id="wk" type="number" min="0" step="0.01" inputmode="decimal"></div>
    <div><label>Monthly allowance (GH₵)</label><input id="mo" type="number" min="0" step="0.01" inputmode="decimal"></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <div class="seg"><button id="vw" class="on">Week</button><button id="vm">Month</button></div>
    <div class="nav"><button id="pv" aria-label="Previous">‹</button><span id="lbl" class="mut"></span><button id="nx" aria-label="Next">›</button></div>
  </div>
  <div class="g" style="margin-top:12px">
    <div><div class="mut">Allowance</div><div class="big" id="sb">–</div></div>
    <div><div class="mut">Spent</div><div class="big" id="ss">–</div></div>
    <div><div class="mut">Left</div><div class="big" id="sl">–</div></div>
  </div>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <div class="mut" id="hint"></div>
</div>

<div class="card">
  <h2>Add expense</h2>
  <div class="g">
    <div><label>Amount (GH₵)</label><input id="am" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    <div><label>Category</label><select id="ct"></select></div>
    <div><label>Date</label><input id="dt" type="date"></div>
    <div><label>Note (optional)</label><input id="nt" type="text" placeholder="e.g. waakye"></div>
  </div>
  <div style="margin-top:10px"><button class="btn p" id="add">Add expense</button></div>
</div>

<div class="card">
  <h2>Where it went</h2>
  <div class="donutwrap"><div class="donut" id="dn"></div><div class="leg" id="lg"></div></div>
</div>

<div class="card">
  <h2>Spending by day</h2>
  <div class="days" id="dy"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2>Expenses</h2>
    <button class="btn" id="csv">Export all as CSV</button>
  </div>
  <div id="ls"></div>
</div>
</main>
<script>
const CATS={"Food":"#e8833a","Transport":"#3a8fe8","Data & Airtime":"#8e5be8","Academics":"#0f9d6b","Hostel & Rent":"#c9a227","Personal Care":"#e85b9a","Fun & Social":"#e8504a","Savings":"#4aa3a3","Other":"#8a8a82"};
let S={wk:0,mo:0,items:[]},view="week",off=0;
const $=id=>document.getElementById(id);
try{const r=localStorage.getItem("allowance-v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("allowance-v1",JSON.stringify(S))}catch(e){}}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const money=n=>"GH₵ "+Number(n).toLocaleString("en-GH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function range(){
  const t=new Date();t.setHours(12,0,0,0);
  if(view==="week"){const m=new Date(t);m.setDate(t.getDate()-((t.getDay()+6)%7)+off*7);const e=new Date(m);e.setDate(m.getDate()+6);return[m,e]}
  const s=new Date(t.getFullYear(),t.getMonth()+off,1,12),e=new Date(t.getFullYear(),t.getMonth()+off+1,0,12);return[s,e];
}
function render(){
  const[s,e]=range(),a=ymd(s),b=ymd(e);
  const fm=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  $("lbl").textContent=view==="week"?fm(s)+" – "+fm(e):s.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  $("vw").classList.toggle("on",view==="week");$("vm").classList.toggle("on",view==="month");
  const its=S.items.filter(i=>i.date>=a&&i.date<=b).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
  const spent=its.reduce((n,i)=>n+i.amt,0),bud=view==="week"?S.wk:S.mo,left=bud-spent;
  $("sb").textContent=bud?money(bud):"Set above";$("ss").textContent=money(spent);
  $("sl").textContent=bud?money(left):"–";$("sl").className="big"+(bud&&left<0?" bad":"");
  const pct=bud?Math.min(100,spent/bud*100):0;$("pb").style.width=pct+"%";$("pb").style.background=pct>=100?"var(--bad)":"var(--ac)";
  const today=new Date();today.setHours(12,0,0,0);
  let h="";
  if(bud){const days=Math.round((e-s)/864e5)+1;
    if(today>=s&&today<=e){const rem=Math.max(1,Math.round((e-today)/864e5)+1);h=left>0?"You can spend about "+money(left/rem)+" per day for the remaining "+rem+" day"+(rem>1?"s":"")+".":"You’re over budget by "+money(-left)+".";}
    else h=left>=0?"Finished with "+money(left)+" to spare.":"Went over by "+money(-left)+".";}
  else h="Enter your "+view+"ly allowance above to see how much is left.";
  $("hint").textContent=h;

  // Donut chart
  const tot={};its.forEach(i=>tot[i.cat]=(tot[i.cat]||0)+i.amt);
  const ents=Object.entries(tot).sort((x,y)=>y[1]-x[1]);
  if(!ents.length){$("dn").style.background="var(--track)";$("lg").innerHTML='<span class="mut">No spending in this period yet.</span>'}
  else{let c=0,g=[];ents.forEach(([k,v])=>{const p=v/spent*100;g.push(CATS[k]+" "+c+"% "+(c+p)+"%");c+=p});
    $("dn").style.background="conic-gradient("+g.join(",")+")";
    $("lg").innerHTML=ents.map(([k,v])=>'<div><b style="background:'+CATS[k]+'"></b><span>'+esc(k)+'</span><span>'+money(v)+' · '+Math.round(v/spent*100)+'%</span></div>').join("")}

  // Spending by day
  const n=Math.round((e-s)/864e5)+1,arr=[];
  for(let k=0;k<n;k++){const d=new Date(s);d.setDate(s.getDate()+k);const key=ymd(d);arr.push({d,v:its.filter(i=>i.date===key).reduce((q,i)=>q+i.amt,0)})}
  const mx=Math.max(1,...arr.map(x=>x.v));
  $("dy").innerHTML=arr.map(x=>'<div title="'+esc(fm(x.d)+": "+money(x.v))+'"><i style="height:'+(x.v/mx*85)+'%"></i><small>'+(n>10?(x.d.getDate()%5===1?x.d.getDate():"&nbsp;"):x.d.toLocaleDateString("en-GB",{weekday:"narrow"}))+'</small></div>').join("");

  // Expense list
  $("ls").innerHTML=its.length?its.map(i=>'<div class="item"><span class="dot" style="background:'+CATS[i.cat]+'"></span><div><div>'+esc(i.note||i.cat)+'</div><div class="mut">'+esc(i.cat)+' · '+esc(new Date(i.date+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}))+'</div></div><span class="amt">'+money(i.amt)+'</span><button class="x" data-id="'+i.id+'" aria-label="Delete">×</button></div>').join(""):'<span class="mut">Nothing logged for this period.</span>';
}
$("ct").innerHTML=Object.keys(CATS).map(k=>"<option>"+esc(k)+"</option>").join("");
$("dt").value=ymd(new Date());
$("wk").value=S.wk||"";$("mo").value=S.mo||"";
$("wk").oninput=()=>{S.wk=parseFloat($("wk").value)||0;save();render()};
$("mo").oninput=()=>{S.mo=parseFloat($("mo").value)||0;save();render()};
$("vw").onclick=()=>{view="week";off=0;render()};
$("vm").onclick=()=>{view="month";off=0;render()};
$("pv").onclick=()=>{off--;render()};
$("nx").onclick=()=>{off++;render()};
$("add").onclick=()=>{
  const amt=parseFloat($("am").value);
  if(!(amt>0)){$("am").focus();return}
  S.items.push({id:Date.now(),amt,cat:$("ct").value,date:$("dt").value||ymd(new Date()),note:$("nt").value.trim()});
  $("am").value="";$("nt").value="";save();render();
};
$("ls").onclick=e=>{
  const id=e.target.dataset&&e.target.dataset.id;
  if(id){S.items=S.items.filter(i=>String(i.id)!==id);save();render()}
};
$("csv").onclick=()=>{
  const rows=[
    ["Date","Amount (GH₵)","Category","Note"],
    ...S.items.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)
      .map(i=>[i.date,Number(i.amt).toFixed(2),i.cat,i.note||""])
  ];
  const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;
  a.download="allowance-expenses-"+ymd(new Date())+".csv";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};
render();
</script>
</body>
</html>
